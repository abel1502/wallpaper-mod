buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://plugins.gradle.org/m2' }
        mavenCentral()
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {changing = true}
        // classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

version = "1.0"
group= "com.abel.wallpaper"  // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "abel-wallpaper"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

repositories {
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "FalsePattern"
        url = "https://mvn.falsepattern.com/releases/"
    }
    maven {
        name = "FalsePattern Gtmege"
        url = "https://mvn.falsepattern.com/gtmega_releases/"
    }
    maven {
        name = "gt"
        url = "https://gregtech.mechaenetia.com/"
    }
    maven {
        name = 'NTMr proxy'
        url = 'https://maven.ntmr.dev/proxy/'
    }
    maven {
        name = 'NTMr release'
        url = 'https://maven.ntmr.dev/releases/'
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    mavenCentral()
}

dependencies {
    compileOnly "com.falsepattern:chunkapi-mc1.7.10:0.8.4"
    compileOnly "com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:0.3.1:dev"

    compileOnly "curse.maven:angelica-988067:8884082"
    compileOnly "mega:fluidlogged-mc1.7.10:0.2.0"

    // Connected textures (runtime-optional, guarded with @Optional)
    compileOnly "com.hbm:HBM-NTM:1.0.27_X5863:dev"
    compileOnly "team.chisel.ctmlib:CTMLib:MC1.7.10-1.4.1.5:deobf"
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

// -- Generic Mixin setup --

runClient {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

runServer {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"
def outRefMapFile = "${tasks.compileJava.temporaryDir}/mixins.abel_wallpaper.refmap.json"

jar {
    manifest {
        attributes (
            // This is the regular way of registering Mixin configs.
            // Setting the tweak class allows Mixin to discover your mod.
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            // Mixin will automatically register any configs specified here.
            'MixinConfigs': "mixins.abel_wallpaper.json",
            
            // To use the IEarlyMixinLoader interface, an FML plugin needs to be
            // registered.
            // Note: the previous two properties aren't required for the early
            // interface.
            // 'FMLCorePlugin': 'com.abel.wallpaper.WallpaperMod',
            
            // If your mod also contains a Forge mod (marked by a @Mod annotation),
            // these need to be set or it will get ignored.
            // Note that a Forge mod is required for late mixins to work.
            //
            // Allow Mixin to discover the Forge mod if FMLCorePluginContainsFMLMod
            // is also set:
            'ForceLoadAsMod': 'true',
            // Allow Forge to discover the Forge mod:
            'FMLCorePluginContainsFMLMod': 'true',
        )
    }
    
    from outRefMapFile;
}

tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"];

reobf {
    addExtraSrgFile outSrgFile
}
